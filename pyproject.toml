[tool.poetry]
name = "hltv_async_api"
version = "1.0.0b"
authors = ["Akim Slys <akimslys2003@gmail.com>"]
description = "Moder asynchronous HLTV API Wrapper for Python"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.poetry.urls]
Homepage = "https://github.com/akimerslys/aiohltv"
Issues = "https://github.com/akimerslys/aiohltv/issues"

[tool.poetry.dependencies]
python = "^3.10"
beautifulsoup4 = "^4.15.0"
aiohttp = "^3.14.5"
pytz = "*"
setuptools = "*"
lxml = "^6.1.3"
Brotli = "^1.2.1"
fake-useragent = "^2.2.0"

requests = { version = "^2.32", optional = true }
selenium = { version = "^4.0", optional = true }
undetected-chromedriver = { version = "^3.5", optional = true }
python-socketio = { version = ">=5.11", optional = true, extras = ["asyncio_client"] }
uvloop = { version = ">=0.19", optional = true, markers = "sys_platform != 'win32'" }

[tool.poetry.extras]
sync = ["requests"]
selenium = ["selenium", "undetected-chromedriver"]
live = ["python-socketio"]
beta = ["uvloop"]
